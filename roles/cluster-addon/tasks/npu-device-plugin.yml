---
# 部署 NPU Device Plugin（华为昇腾 NPU）
# 使 kubelet 能识别 huawei.com/Ascend910 等 NPU 资源
# 前置条件: 节点已通过 roles/gpu-node/tasks/npu.yml 安装昇腾驱动和 ascend-docker-runtime

- block:
    - name: 准备 npu-device-plugin 部署目录
      file: name={{ cluster_dir }}/yml/gpu state=directory

    - name: 生成 npu-device-plugin 部署文件
      template:
        src: gpu/npu-device-plugin.yaml.j2
        dest: "{{ cluster_dir }}/yml/gpu/npu-device-plugin.yaml"

    - name: 部署 npu-device-plugin
      shell: "{{ bin_dir }}/kubectl apply -f {{ cluster_dir }}/yml/gpu/npu-device-plugin.yaml"

    - name: 等待 npu-device-plugin DaemonSet 就绪
      shell: >
        {{ bin_dir }}/kubectl -n kube-system rollout status
        daemonset/npu-device-plugin-daemonset --timeout=120s
      ignore_errors: true

    - name: 查看 npu-device-plugin Pod 状态
      shell: "{{ bin_dir }}/kubectl -n kube-system get pods -l app=npu-device-plugin -o wide"
      register: npudp_pods
      ignore_errors: true

    - name: 打印 npu-device-plugin Pod 状态
      debug:
        msg: "{{ npudp_pods.stdout_lines }}"

  when: 'npu_device_plugin_install == "yes"'
