---
# NVIDIA GPU 节点安装任务
# 参考阿里云 nvidia-gpu-installer.sh 的安装流程，适配 kubeasz 的 Ansible 模式

# ---- 1. 系统预检 ----
- name: 检查是否安装了 lspci 工具
  shell: "which lspci || true"
  register: lspci_check
  changed_when: false

- name: 安装 pciutils（提供 lspci）
  package:
    name: pciutils
    state: present
  when: "lspci_check.stdout == ''"
  ignore_errors: true

# ---- 2. 禁用 nouveau 开源驱动 ----
- name: 创建 nouveau 黑名单配置文件
  copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    content: |
      blacklist nouveau
      options nouveau modeset=0
    owner: root
    group: root
    mode: "0644"
  register: nouveau_blacklist

- name: 重建 initramfs（禁用 nouveau 后需要）
  shell: |
    if which dracut &>/dev/null; then
      dracut --force
    elif which update-initramfs &>/dev/null; then
      update-initramfs -u
    fi
  when: nouveau_blacklist.changed
  ignore_errors: true

# ---- 3. 安装内核开发头文件 ----
- name: 安装内核开发依赖（RHEL/CentOS）
  shell: |
    yum install -y kernel-devel-$(uname -r) gcc make file dracut || \
    dnf install -y kernel-devel-$(uname -r) gcc make file dracut || true
  when: "ansible_os_family == 'RedHat'"
  ignore_errors: true

- name: 安装内核开发依赖（Debian/Ubuntu）
  shell: |
    apt-get install -y linux-headers-$(uname -r) gcc make file || true
  when: "ansible_os_family == 'Debian'"
  ignore_errors: true

# ---- 4. 安装 NVIDIA 驱动 ----
- name: 检查 NVIDIA 驱动是否已安装（nvidia-smi）
  shell: "which nvidia-smi && nvidia-smi -L"
  register: nvsmi_check
  changed_when: false
  ignore_errors: true

- name: 验证驱动安装源配置（url 和本地包至少配一个）
  fail:
    msg: >
      NVIDIA 驱动未安装，且未配置 nvidia_driver_url 或 nvidia_driver_local_pkg。
      请在 config.yml 中设置其中一项，或将 GPU 节点已有驱动并重新运行。
  when:
    - "nvsmi_check.rc != 0 or nvsmi_check.stdout == ''"
    - "nvidia_driver_url == ''"
    - "nvidia_driver_local_pkg == ''"
    - "not GPU_FORCE_INSTALL|bool"

- name: 下载 NVIDIA 驱动安装包
  get_url:
    url: "{{ nvidia_driver_url }}"
    dest: "/tmp/nvidia-driver-{{ nvidia_driver_version }}.run"
    timeout: 600
    validate_certs: false
  when:
    - "nvsmi_check.rc != 0 or nvsmi_check.stdout == ''"
    - "nvidia_driver_url != ''"

- name: 拷贝本地 NVIDIA 驱动安装包
  copy:
    src: "{{ nvidia_driver_local_pkg }}"
    dest: "/tmp/nvidia-driver-{{ nvidia_driver_version }}.run"
    mode: "0755"
  when:
    - "nvsmi_check.rc != 0 or nvsmi_check.stdout == ''"
    - "nvidia_driver_url == ''"
    - "nvidia_driver_local_pkg != ''"

- name: 安装 NVIDIA 驱动（runfile 方式）
  shell: |
    chmod +x /tmp/nvidia-driver-{{ nvidia_driver_version }}.run
    sh /tmp/nvidia-driver-{{ nvidia_driver_version }}.run -a -s -q \
      --dkms || sh /tmp/nvidia-driver-{{ nvidia_driver_version }}.run -a -s -q
  when:
    - "nvsmi_check.rc != 0 or nvsmi_check.stdout == ''"
    - "nvidia_driver_url != '' or nvidia_driver_local_pkg != ''"
  register: nvidia_driver_install
  ignore_errors: true

- name: 验证 NVIDIA 驱动安装结果
  shell: "nvidia-smi -L"
  register: nvsmi_post_install
  changed_when: false
  ignore_errors: true
  when: "nvsmi_check.rc != 0 or nvsmi_check.stdout == ''"

- name: 打印驱动安装结果
  debug:
    msg: "NVIDIA 驱动安装完成: {{ nvsmi_post_install.stdout_lines | default(['(跳过检测，驱动已预装)']) }}"

- name: 配置 NVIDIA 驱动持久化参数
  shell: |
    nvidia-smi -pm 1 || true
    nvidia-smi -acp 0 || true
    nvidia-smi --auto-boost-default=0 || true
    nvidia-smi --auto-boost-permission=0 || true
    nvidia-modprobe -u -c=0 -m || true
  ignore_errors: true

- name: 将 NVIDIA 驱动持久化配置写入 rc.local（RedHat 系）
  blockinfile:
    path: /etc/rc.d/rc.local
    create: true
    mode: "0755"
    marker: "# {mark} ANSIBLE MANAGED - NVIDIA GPU CONFIGURATION"
    block: |
      nvidia-smi -pm 1 || true
      nvidia-smi -acp 0 || true
      nvidia-smi --auto-boost-default=0 || true
      nvidia-smi --auto-boost-permission=0 || true
      nvidia-modprobe -u -c=0 -m || true
  when: "ansible_os_family == 'RedHat'"

- name: 将 NVIDIA 驱动持久化配置写入 rc.local（Debian 系）
  blockinfile:
    path: /etc/rc.local
    create: true
    mode: "0755"
    marker: "# {mark} ANSIBLE MANAGED - NVIDIA GPU CONFIGURATION"
    block: |
      nvidia-smi -pm 1 || true
      nvidia-smi -acp 0 || true
      nvidia-smi --auto-boost-default=0 || true
      nvidia-smi --auto-boost-permission=0 || true
      nvidia-modprobe -u -c=0 -m || true
  when: "ansible_os_family == 'Debian'"

# ---- 5. 安装 nvidia-persistenced 服务 ----
- name: 检查 nvidia-persistenced 二进制是否存在
  shell: "which nvidia-persistenced || true"
  register: persistenced_bin_check
  changed_when: false

- name: 创建 nvidia-persistenced systemd 服务单元
  copy:
    dest: /etc/systemd/system/nvidia-persistenced.service
    content: |
      [Unit]
      Description=NVIDIA Persistence Daemon
      Wants=syslog.target

      [Service]
      User=root
      Type=forking
      TimeoutStartSec=60
      ExecStart=/usr/bin/nvidia-persistenced --verbose
      ExecStopPost=/bin/rm -rf /var/run/nvidia-persistenced

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  when: "persistenced_bin_check.stdout != ''"
  register: persistenced_unit

- name: 启用并启动 nvidia-persistenced 服务
  systemd:
    name: nvidia-persistenced
    enabled: true
    state: started
    daemon_reload: true
  when: "persistenced_unit is changed"
  ignore_errors: true

# ---- 6. 安装 NVIDIA Container Toolkit ----
- name: 检查 nvidia-container-runtime 是否已安装
  shell: "which nvidia-container-runtime || true"
  register: nvcr_check
  changed_when: false

- name: 添加 NVIDIA Container Toolkit 仓库（RHEL 系）
  shell: |
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo \
      -o /etc/yum.repos.d/nvidia-container-toolkit.repo
  when:
    - "nvcr_check.stdout == ''"
    - "ansible_os_family == 'RedHat'"
    - "nvidia_toolkit_install_source == 'online'"
  ignore_errors: true

- name: 添加 NVIDIA Container Toolkit 仓库（Debian 系）
  shell: |
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | \
      gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
      sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
      tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
    apt-get update -y
  when:
    - "nvcr_check.stdout == ''"
    - "ansible_os_family == 'Debian'"
    - "nvidia_toolkit_install_source == 'online'"
  ignore_errors: true

- name: 通过包管理器安装 nvidia-container-toolkit（在线模式）
  package:
    name: nvidia-container-toolkit
    state: present
  when:
    - "nvcr_check.stdout == ''"
    - "nvidia_toolkit_install_source == 'online'"
  ignore_errors: true

- name: 创建离线安装临时目录
  file:
    path: /tmp/nvidia-container-toolkit
    state: directory
    mode: "0755"
  when:
    - "nvcr_check.stdout == ''"
    - "nvidia_toolkit_install_source == 'offline'"

- name: 拷贝本地 nvidia-container-toolkit 安装包（离线模式）
  copy:
    src: "{{ item }}"
    dest: "/tmp/nvidia-container-toolkit/"
    mode: "0644"
  with_fileglob:
    - "{{ base_dir }}/roles/gpu-node/files/nvidia-container-toolkit/*"
  when:
    - "nvcr_check.stdout == ''"
    - "nvidia_toolkit_install_source == 'offline'"
  ignore_errors: true

- name: 离线安装 nvidia-container-toolkit（RHEL 系）
  shell: "yum --nogpgcheck -y localinstall /tmp/nvidia-container-toolkit/*.rpm"
  when:
    - "nvcr_check.stdout == ''"
    - "nvidia_toolkit_install_source == 'offline'"
    - "ansible_os_family == 'RedHat'"
  ignore_errors: true

- name: 离线安装 nvidia-container-toolkit（Debian 系）
  shell: "dpkg -i /tmp/nvidia-container-toolkit/*.deb || apt-get install -f -y"
  when:
    - "nvcr_check.stdout == ''"
    - "nvidia_toolkit_install_source == 'offline'"
    - "ansible_os_family == 'Debian'"
  ignore_errors: true

# ---- 7. 配置 containerd 集成 nvidia-container-runtime ----
- name: 使用 nvidia-ctk 配置 containerd 支持 GPU runtime
  shell: "nvidia-ctk runtime configure --runtime=containerd"
  ignore_errors: true
  register: ctk_configure

- name: 重启 containerd 以加载 GPU runtime 配置
  systemd:
    name: "{{ CONTAINERD_SERVICE_NAME }}"
    state: restarted
    daemon_reload: true
  when: "ctk_configure.rc == 0"
  ignore_errors: true

# ---- 8. 为 GPU 设备创建符号链接（参考 nvidia_gpu_alinux3_recover.sh）----
- name: 为 GPU 字符设备在 /dev/char 下创建符号链接
  shell: |
    mkdir -p /dev/char
    ls -l /dev/ | grep '^c.*nvidia' | \
      awk '{sub(",", ":", $5); system("ln -sf /dev/"$10" /dev/char/"$5$6)}' || true
  ignore_errors: true

# ---- 9. 为节点打 GPU 标签 ----
# 注意：标签 nvidia.com/gpu=true 与 npu-device-plugin.yaml.j2 中的 nodeSelector 保持一致
- name: 为 GPU 节点打 Kubernetes 标签
  shell: |
    {{ bin_dir }}/kubectl label node {{ K8S_NODENAME }} \
      nvidia.com/gpu=true \
      accelerator=nvidia-gpu \
      {{ nvidia_gpu_node_label_key }}={{ nvidia_gpu_node_label_value }} \
      --overwrite
  delegate_to: "{{ groups['kube_master'][0] }}"
  ignore_errors: true
  when: "nvidia_label_node|bool"
